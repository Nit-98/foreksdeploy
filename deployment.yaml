apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: 201971881499.dkr.ecr.ap-south-2.amazonaws.com/myapp:IMAGE_TAG
          ports:
            - containerPort: 8000

